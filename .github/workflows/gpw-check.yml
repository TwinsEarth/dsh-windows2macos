name: gpw-check
on:
  push:
    branches:
      - release/2.2.2
jobs:
  gpw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: gpw-auto-approve (the Linux regression)
        run: node --test --test-force-exit test/gpw-auto-approve.test.mjs
      - name: gpw-ai-priority + gpw-modes
        run: node --test --test-force-exit test/gpw-ai-priority.test.mjs test/gpw-modes.test.mjs
