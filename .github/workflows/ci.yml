name: CI

# Runs on every push and pull request.
#
# The matrix is not decoration. This project claims to drive a Windows machine
# and a macOS machine, and until this workflow existed every measurement had been
# taken on Windows only -- the README said so. Running the same suites on
# macos-latest and ubuntu-latest is what turns "ported" into "tested", and it is
# the cheapest way to find out that a path separator, a line ending or a missing
# tool assumption was baked in somewhere.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint is deliberately its own job rather than a step inside `test`.
  #
  # It is the cheapest signal in the workflow (seconds, one OS) and it fails for
  # a completely different reason than a test failure, so separating them keeps
  # "the code does not parse / has an unbound identifier" from being reported as
  # "the relay behaved differently on macOS".
  #
  # Why `npm install` and not `npm ci`: this project commits no lockfile on
  # purpose, so `npm ci` cannot run at all. The devDependencies carry caret
  # ranges and are resolved fresh on every run, which is the same behaviour a
  # developer gets locally. Nothing here is a runtime dependency; the published
  # package still declares `"dependencies": {}`.
  lint:
    name: lint (eslint + prettier check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      # A blocking gate: eslint errors are real findings (unbound identifiers,
      # unused bindings, dead code). Warnings do not fail the run by design --
      # see docs/LINT-AUDIT.md for which rules are warnings and why.
      - name: ESLint
        run: npm run lint

      # Reported, not blocking. Prettier in this repository is a tool for new
      # files, not a formatter for the existing tree: matching the hand-written
      # style exactly is not possible with Prettier's options, and running it
      # would rewrite ~90% of the lines in the project. Measuring costs nothing;
      # gating would demand that rewrite or a permanent ignore list.
      #
      # Once the tree is formatted (or the scope narrowed), flip `|| true` into
      # a hard failure by deleting it -- the job already does the right thing.
      - name: Prettier (informational)
        run: |
          echo "::group::prettier --check ."
          npm run format:check || true
          echo "::endgroup::"
          changed=$(npx --no-install prettier --list-different . | wc -l)
          echo "::warning title=Prettier::$changed file(s) are not prettier-formatted; this is informational, see docs/LINT-AUDIT.md"
          echo "files prettier would change: $changed"

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide the others: the interesting
      # information in a cross-platform project is exactly *which* platform
      # failed, so let them all finish.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # 20 is the floor declared in package.json engines; 22 is what most
        # users will have. The suite also runs on 24 locally.
        node: ['20', '22']
        exclude:
          # The floor and the common case are both worth testing, but not on
          # every OS -- that would be 9 jobs for no extra signal.
          - os: ubuntu-latest
            node: '20'
          - os: macos-latest
            node: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Report environment
        shell: bash
        run: |
          node --version
          npm --version || true
          git --version
          echo "platform: $RUNNER_OS"

      # The test fixtures create throwaway git repositories and commit to them.
      # GitHub runners have no global identity configured, and `git commit`
      # fails without one. These are deliberately fake values.
      - name: Configure a git identity for the test fixtures
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          # Make the line-ending behaviour explicit rather than runner-dependent:
          # the end-to-end suite asserts that two checkouts fingerprint
          # identically, and an inherited autocrlf setting would make that flaky
          # for reasons that have nothing to do with this project.
          git config --global core.autocrlf false

      - name: Entry points import (the specifier cordis.patch.yml mounts)
        working-directory: .
        run: node scripts/check-entrypoints.mjs

      - name: Install the package and assert it registers eight tools
        shell: bash
        run: node scripts/verify-installed.mjs "$(pwd)"

      # THE DEV TOOLING IS HERE BECAUSE ONE DECLARED SUITE READS IT, not because anything above needs it.
      #
      # `test/claims.test.mjs` asserts that every artifact `GATE_INVENTORY` in `scripts/preflight.mjs`
      # names is present in the tree -- that is the check which catches a gate deleted from the pre-flight
      # -- and the first row of that inventory is the eslint entry point at
      # `node_modules/eslint/bin/eslint.js`. With no `node_modules/`, that assertion fails with
      # "the inventory names files that are not in the tree: eslint entry point
      # (node_modules/eslint/bin/eslint.js)", which says nothing about the code under test. Measured by
      # running `npm test` in a clone of this commit with no `node_modules/`: it is a property of the
      # checkout rather than of the runner, so it fails every leg the same way.
      #
      # Why not the alternatives: a hand-listed suite subset is what v0.6.0 deleted (and the pre-flight
      # refuses one), and narrowing or dropping the claims assertion would remove the check that notices a
      # gate which stopped being measured. So the job gives the declared suite what it needs.
      #
      # Same flags as the `lint` job above and the `preflight` job below: this project commits no lockfile
      # on purpose, so `npm install` and not `npm ci`. Nothing here is a runtime dependency; the published
      # package still declares `"dependencies": {}`.
      - name: Install dev tooling (a declared suite reads the gate inventory)
        run: npm install --no-audit --no-fund

      - name: Unit and release suites (package.json#scripts.test, via npm test)
        # THE LIST IS NOT HERE ON PURPOSE. It used to be: twenty-three paths, hand-maintained,
        # and stale -- six suites that exist, are named by `scripts.test`, and pass on a developer's
        # machine ran in no workflow at all, `test/claims.test.mjs` among them. `npm test` runs
        # whatever `package.json#scripts.test` names today, so adding a suite to the release suite is
        # one edit in one place. `scripts/preflight.mjs` verifies that this workflow still covers
        # every suite that script declares (check name: "workflow wiring"), and refuses a workflow
        # that hand-lists two or more suite paths on one `node --test` line.
        run: npm test

      - name: End-to-end suites (package.json#scripts.test:e2e, via npm run test:e2e)
        # Same rule, same reason. `--test-force-exit` is inside the script: each simulated machine
        # holds an open SSE connection, which keeps the event loop alive after the assertions pass.
        #
        # test:e2e covers what only a networked deployment can get wrong: sub-path mounting, the two
        # credential kinds, relay restart recovery, pairing rate limits, proxy-header trust, and the
        # anti-buffering headers a tunnel needs.
        run: npm run test:e2e

      - name: Packer reproduces the manifest (and refuses missing paths)
        run: node scripts/pack.mjs --out dist

  # The real-GitHub test is deliberately *not* part of the blocking matrix above.
  #
  # GitHub allows 60 unauthenticated API requests per hour per IP and hosted runners share IPs, so
  # that test failed on macos-latest with HTTP 403 RATE_LIMITED while every other job passed. A
  # release gate that depends on someone else's rate-limit budget is a coin flip, and the usual
  # sequel is that someone deletes the test rather than fixing it.
  #
  # Here it runs with the workflow token, which raises the limit, and it does not gate anything:
  # its outcome is reported and nothing more. The mocked coverage of the same code paths always runs
  # in the matrix above.
  live-api:
    name: live GitHub API (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Real GitHub release lookup
        env:
          W2M_NETWORK_TESTS: '1'
          W2M_UPDATE_TOKEN: ${{ github.token }}
        run: node --test test/update-source.test.mjs

  pack:
    name: release artifact is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A published tarball whose hash cannot be reproduced from source is a
      # tarball nobody can verify. Packing twice must produce identical bytes,
      # which is the property scripts/pack.mjs is built around.
      #
      # It also compares against the *published* asset for the current version.
      # Testing only against a second pack on the same machine would have missed
      # the real defect: gzip stamps an OS byte from the host, so a Windows pack
      # and a Linux pack of identical sources differed in one byte and nothing
      # here would have noticed.
      - name: Pack twice and compare
        run: |
          node scripts/pack.mjs --out dist-a
          node scripts/pack.mjs --out dist-b
          a=$(sha256sum dist-a/*.tgz | cut -d' ' -f1)
          b=$(sha256sum dist-b/*.tgz | cut -d' ' -f1)
          echo "first : $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::packing the same sources twice produced different bytes"
            exit 1
          fi
          echo "reproducible on this runner: $a"

      # Note on what is deliberately *not* checked here.
      #
      # Comparing a local build against the published release asset looks like an
      # obvious guard, but it races by construction: a tag push starts this
      # workflow and the release workflow at the same time, so CI reads the
      # previous asset while Release is replacing it. That failed once, on a
      # correct release, and a check that cries wolf on success gets weakened the
      # first time someone is in a hurry.
      #
      # The property still holds and is still enforced -- but from a position with
      # no race: the release workflow verifies the tag matches package.json, runs
      # the end-to-end suites and the pre-flight (which packs, asserts the tarball
      # and confirms the packed copy registers its eight tools), and only then
      # publishes. Cross-platform reproducibility (the gzip OS byte) is covered by
      # packing twice on Linux and comparing against Windows builds during
      # development.

      - name: The manifest's declared paths all exist
        run: node -e "
          const m = require('./package.json');
          const fs = require('fs');
          const missing = [];
          for (const [k, v] of Object.entries(m.bin ?? {})) if (!fs.existsSync(v)) missing.push('bin.' + k + ' -> ' + v);
          for (const [k, v] of Object.entries(m.exports ?? {})) {
            if (typeof v === 'string' && v.startsWith('./') && !fs.existsSync(v)) missing.push('exports.' + k + ' -> ' + v);
          }
          if (missing.length) { console.error('missing:', missing.join(', ')); process.exit(1); }
          console.log('all manifest paths exist');
          "

  # The release pre-flight, wired into CI so that the release path runs the same gate a human runs.
  #
  # WHY THIS JOB EXISTS AT ALL: `scripts/preflight.mjs` used to be invoked by zero workflows and by no
  # npm script, and `test/claims.test.mjs` -- the suite that catches a version bump with no CHANGELOG
  # entry -- was named by no workflow. Both were "gates" that ran only when a human remembered to run
  # them, and a gate nobody runs before publishing is a post-mortem, which is what this repository's
  # v0.5.6 / v0.5.7 / v0.5.8 sequence was. This job runs the whole pre-flight on every push and pull
  # request: the wiring checks, lint, the mojibake scan, the declared suite, the pack, the
  # tree-derived tarball assertions, the claims suite and the CHANGELOG shape.
  #
  # One operating system, deliberately: the matrix above is the cross-platform signal, and the
  # pre-flight is a statement about the release process rather than about a platform. Its declared
  # suite is the same list on all three.
  #
  # What is NOT the same on all three is which of that suite's assertions *skip*, because two of them
  # are platform-conditional: `test/agent.test.mjs` asserts two facts about NTFS, and the 0600
  # permission assertion next to it is a fact about a POSIX filesystem. This runner is Linux, so the
  # entry this job needs is the POSIX side of that pair (`posix-has-no-windows-filesystem` in
  # ACCEPTED_SKIPS, qualified to darwin and linux). The Windows-side entries in the same list
  # (`ntfs-has-no-posix-bits`, `windows-is-not-a-posix-shell`) are inert here and are exercised where
  # the other platform's skips are produced: a human running `node scripts/preflight.mjs` on Windows,
  # and the windows-latest legs of the matrix above, which run the same assertions and report the
  # skips -- `npm test` tolerates them; only the pre-flight classifies them.
  preflight:
    name: release pre-flight (the gate a human runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One of the pre-flight's checks is eslint with 0 errors required, so it needs the dev tooling.
      # `npm install` and not `npm ci`: this project commits no lockfile on purpose.
      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      # The test fixtures create throwaway git repositories and commit to them; runners have no
      # global identity. Same step, same values, as the matrix job above.
      - name: Configure a git identity for the test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      # PACK BEFORE THE PRE-FLIGHT, NOT AFTER IT.
      #
      # Without this step the pre-flight is RED on a fresh checkout, and on a developer machine it looked
      # green only because `dist/` still held a tarball from an earlier pack -- the "it works here" this
      # gate exists to refuse.
      #
      # WHY: the pre-flight's declared-suite check reads the TAP capture of every suite and classifies each
      # skip -- an assertion that did not run is a hole, and a skip whose reason is not on ACCEPTED_SKIPS is
      # a FAIL. `test/claims.test.mjs` holds three assertions about the *packed* tree (the tarball in
      # `dist/` carries nothing forbidden, the packed manifest is the tree's manifest field for field, and
      # every declared document ships), and each of them skips when `dist/` holds no tarball. `dist/` is
      # gitignored, so a fresh checkout has none; measured by moving `dist/` aside, the run comes back
      # "10 pass, 1 fail, 1 unverifiable -- RED" naming `no dist/ in this checkout: the packed tree was not
      # verified here`.
      #
      # That skip is honest, but its reason is not one this repository has agreed to accept, and the answer
      # is not to accept it: adding it to ACCEPTED_SKIPS would trade three real assertions about the
      # artifact users install for a green light. Packing first is what lets the real check run. It is the
      # same deterministic packer, on the same sources, that the pre-flight's own packed-tarball check
      # runs, so this is a precondition rather than a second, weaker path to the same verdict -- and it
      # needs no `npm install`, because scripts/pack.mjs imports nothing outside `node:` builtins.
      - name: Pack (the tarball the pre-flight's packed-tree assertions measure)
        run: node scripts/pack.mjs --out dist

      - name: Pre-flight (exit 1 is RED, do not bump)
        run: node scripts/preflight.mjs
