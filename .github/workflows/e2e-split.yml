        run: node --test --test-force-exit test/re-pair-stale-token.test.mjs
      - name: e2e gpw-folder-policy.test.mjs
        run: node --test --test-force-exit test/gpw-folder-policy.test.mjs
      - name: e2e gpw-activation.test.mjs
        run: node --test --test-force-exit test/gpw-activation.test.mjs
      - name: e2e gpw-hardening.test.mjs
        run: node --test --test-force-exit test/gpw-hardening.test.mjs
      - name: e2e gpw-tamper-gate.test.mjs
        run: node --test --test-force-exit test/gpw-tamper-gate.test.mjs
      - name: e2e gpw-persistence.test.mjs
