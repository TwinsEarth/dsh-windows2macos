# Temporary diagnostic workflow: one step per e2e test file.
# The failed step name identifies the failing file even without log access.
name: e2e-split

on:
  push:
    branches:
      - release/2.2.2

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install dev tooling
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: e2e e2e.test.mjs
        run: node --test --test-force-exit test/e2e.test.mjs
      - name: e2e crossnetwork.test.mjs
        run: node --test --test-force-exit test/crossnetwork.test.mjs
      - name: e2e signing-e2e.test.mjs
        run: node --test --test-force-exit test/signing-e2e.test.mjs
      - name: e2e outbound-only.test.mjs
        run: node --test --test-force-exit test/outbound-only.test.mjs
      - name: e2e recovery.test.mjs
        run: node --test --test-force-exit test/recovery.test.mjs
      - name: e2e pipeline-e2e.test.mjs
        run: node --test --test-force-exit test/pipeline-e2e.test.mjs
      - name: e2e p2p-agent.test.mjs
        run: node --test --test-force-exit test/p2p-agent.test.mjs
      - name: e2e secondary-link.test.mjs
        run: node --test --test-force-exit test/secondary-link.test.mjs
      - name: e2e bootstrap-cli.test.mjs
        run: node --test --test-force-exit test/bootstrap-cli.test.mjs
      - name: e2e bootstrap.test.mjs
        run: node --test --test-force-exit test/bootstrap.test.mjs
      - name: e2e windows-hidden-task.test.mjs
        run: node --test --test-force-exit test/windows-hidden-task.test.mjs
      - name: e2e relay-failover.test.mjs
        run: node --test --test-force-exit test/relay-failover.test.mjs
      - name: e2e npm-update.test.mjs
        run: node --test --test-force-exit test/npm-update.test.mjs
      - name: e2e agent-start-nonblocking.test.mjs
        run: node --test --test-force-exit test/agent-start-nonblocking.test.mjs
      - name: e2e fleet-chat-capture.test.mjs
        run: node --test --test-force-exit test/fleet-chat-capture.test.mjs
      - name: e2e capture-route.test.mjs
        run: node --test --test-force-exit test/capture-route.test.mjs
      - name: e2e update-resolver.test.mjs
