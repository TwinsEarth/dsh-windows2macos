name: preflight-check
on:
  push:
    branches:
      - release/2.2.2
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/pack.mjs --out dist
      - name: pre-flight
        run: |
          set +e
          node scripts/preflight.mjs > "$RUNNER_TEMP/preflight.log" 2>&1
          code=$?
          echo "exit_code=$code" > preflight-report.txt
          grep -E '^  (FAIL|UNVERIF)|✖|not ok' "$RUNNER_TEMP/preflight.log" | head -n 80 >> preflight-report.txt
          tail -n 15 "$RUNNER_TEMP/preflight.log" >> preflight-report.txt
          exit $code
      - name: publish report (only when red)
        if: failure()
        run: |
          git config user.email "ci@w2m.local"
          git config user.name "w2m-ci"
          git checkout -B ci-preflight
          git add -f preflight-report.txt
          git commit -m "preflight report" || true
          git push --force origin ci-preflight || true
