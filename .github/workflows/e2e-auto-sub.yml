# Temporary diagnostic: matrix jobs over gpw-auto-approve subtests (failed job name = failing subtest).
name: e2e-auto-sub

on:
  push:
    branches:
      - release/2.2.2

jobs:
  subtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - "approves a yellow call after the timeout"
          - "keeps red denied outright"
          - "keeps a whitelist hit immediate"
          - "exposes the 10 s default in the source"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install dev tooling
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: run subtest
        run: node --test --test-force-exit --test-name-pattern="${{ matrix.pattern }}" test/gpw-auto-approve.test.mjs
