name: gpw-tests-check
on:
  push:
    branches:
      - release/2.2.2
jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: gpw-ai unit
        run: node --test --test-force-exit test/gpw-ai.test.mjs
      - name: gpw-ai priority
        run: node --test --test-force-exit test/gpw-ai-priority.test.mjs
      - name: gpw-ai priority (repeat 5x, timer races)
        run: |
          for i in 1 2 3 4 5; do node --test --test-force-exit test/gpw-ai-priority.test.mjs || exit 1; done
