name: Release

# Publishing by hand is what went wrong in 0.0.1: the tarball was uploaded before
# the documentation stopped changing, so the published bytes no longer matched
# the tagged source, and the release had to be re-cut. Reproducing the artifact
# from the tag inside CI removes the human step that caused it.
#
# Trigger: push a tag like v0.1.2

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: verify, pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The tag and package.json must agree
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag: $tag"
          echo "package.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg — refusing to publish a mislabelled artifact"
            exit 1
          fi

      # Releasing an artifact from a commit whose tests never ran is how a broken
      # package reaches users. The tag points at a specific commit; this proves
      # that commit passes before anything is published.
      - name: Configure a git identity for the test fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Entry points import
        run: node scripts/check-entrypoints.mjs

      # Same reasoning as ci.yml's lint job: this project commits no lockfile on purpose, so
      # `npm install` rather than `npm ci`. The pre-flight below lints as one of its checks.
      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: End-to-end suites (package.json#scripts.test:e2e, via npm run test:e2e)
        # The e2e suites exercise real processes over real sockets -- restart, sub-path mounting, the
        # credential kinds -- and they gate the release. The list lives in `scripts.test:e2e` and is
        # not repeated here: it used to be, and the copy went stale. `scripts/preflight.mjs` fails the
        # run if this workflow stops covering every suite `package.json#scripts.test` declares.
        run: npm run test:e2e

      - name: Release pre-flight (the same gate a human runs, exit 1 is RED)
        # THE RELEASE GATE IS ONE COMMAND, AND IT IS THE SAME COMMAND A HUMAN RUNS.
        #
        # This step replaces two hand-maintained suite lists. Both were stale in the same way: six
        # suites that exist, are named by `package.json#scripts.test`, and pass locally ran in no
        # workflow at all -- including `test/claims.test.mjs`, which is the suite that catches a
        # version bump with no CHANGELOG entry. The comment that used to sit on the unit-suite step
        # ("a new suite is invisible to the release gate until it is added here ... that has bitten
        # this project once already") is the honest measure of what a comment is worth next to a list.
        #
        # `scripts/preflight.mjs` reads `package.json#scripts.test`, so a suite added to the release
        # suite is run here with no second edit. It asserts, in this order: that every gate it
        # delegates to exists; that the ledger catches a check which reports nothing; that every suite
        # on disk is named by a script; that this workflow and ci.yml still run every suite
        # `scripts.test` declares and that neither hand-lists a suite set; lint with 0 errors; a
        # mojibake scan; the declared suite; a deterministic pack plus tarball assertions derived from
        # the *tree* (documents, entry points, the whole manifest, forbidden paths, the eight tools
        # from the packed copy); the claims suite -- where zero executed claims is a FAIL; and the
        # CHANGELOG's shape.
        run: node scripts/preflight.mjs

      - name: Pack
        run: |
          set -euo pipefail
          node scripts/pack.mjs --out dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: The packed artifact loads and registers its tools
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar -xzf dist/*.tgz -C unpacked
          node scripts/verify-installed.mjs "$(pwd)/unpacked/package"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; uploading assets with --clobber"
            gh release upload "$tag" dist/*.tgz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --title "DSH: Windows2MacOS $tag" \
              --generate-notes \
              dist/*.tgz dist/SHA256SUMS
          fi
          gh release view "$tag" --json assets,url

  # ---------------------------------------------------------------------------------------------
  # npm
  #
  # It publishes **the file the release just published**, fetched back from the release and checked
  # against SHA256SUMS, not a fresh `npm pack`. One artifact, one answer to "which bytes did you
  # install" -- the same reason the packer is shared.
  #
  # Two ways to authenticate, in order of preference, and neither is required for a release to be
  # green:
  #
  #   1. **Trusted publishing (OIDC)** -- nothing stored in this repository. On npmjs.com, in the
  #      package's settings, add a Trusted Publisher: GitHub Actions, repo
  #      TwinsEarth/dsh-windows2macos, workflow release.yml. `id-token: write` below is what makes
  #      the exchange possible, and `--provenance` attaches the attestation.
  #   2. **`NPM_TOKEN` repository secret** -- a granular/automation token with publish rights.
  #
  # `continue-on-error` is deliberate. These credentials live outside the repository, so an
  # unconfigured or expired npm credential must not paint every future release red -- but it must
  # not pass silently either, which is why the step prints why it skipped and the job still shows up
  # as failed when it tried and could not.
  # ---------------------------------------------------------------------------------------------
  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `registry-url` here on purpose. It writes an .npmrc whose auth line expands from
          # NODE_AUTH_TOKEN; with no token secret that line is empty and shadows the OIDC exchange
          # instead of falling through to it. The token is configured explicitly below, only when
          # the secret actually exists.

      - name: An npm CLI new enough for the OIDC exchange
        # Node 22 bundles npm 10.x, and trusted publishing needs npm >= 11.5.1. Without this the job
        # fails with an auth error that looks like a permissions problem and is not one.
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Publish the tarball the release published
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          asset="twinsearth-w2m-dsh-plugin-${version}.tgz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
            echo "authenticating with the NPM_TOKEN secret"
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no token secret: relying on trusted publishing (OIDC)"
          else
            echo "::warning::skipping npm: neither NPM_TOKEN nor an OIDC token is available"
            exit 0
          fi

          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          curl -fsSL -o /tmp/SHA256SUMS "${base}/SHA256SUMS"
          ( cd /tmp && grep " ${asset}\$" SHA256SUMS | sha256sum -c - )

          if npm view "@twinsearth/w2m-dsh-plugin@${version}" version >/dev/null 2>&1; then
            echo "already on npm: ${version} -- nothing to do"
            exit 0
          fi

          npm publish "/tmp/${asset}" --access public --provenance

          # The registry does not serve a version the instant the publish returns. Measured: an
          # immediate `npm view` answered 404, and `set -e` turned a *successful* publish into a red
          # job -- the log shows the provenance statement was already signed before that 404. So this
          # polls, and a version that is merely slow to appear is a warning, never a failure.
          for attempt in 1 2 3 4 5 6; do
            if out="$(npm view "@twinsearth/w2m-dsh-plugin@${version}" version dist.integrity 2>/dev/null)"; then
              echo "on npm:"
              echo "${out}"
              exit 0
            fi
            echo "not served by the registry yet (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::warning::published ${version}, but the registry had not served it after 60s -- check npm before assuming the publish failed"
