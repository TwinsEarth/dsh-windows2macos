name: e2e-report
on:
  push:
    branches:
      - release/2.2.2
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: run the e2e gate, keep the failure details
        run: |
          set +e
          npm run test:e2e > "$RUNNER_TEMP/e2e.log" 2>&1
          code=$?
          echo "exit_code=$code" > e2e-report.txt
          echo "--- failure lines ---" >> e2e-report.txt
          grep -nE -A4 '✖|not ok [0-9]+|AssertionError|failing tests|# fail' "$RUNNER_TEMP/e2e.log" | head -n 220 >> e2e-report.txt
          echo "--- tail ---" >> e2e-report.txt
          tail -n 100 "$RUNNER_TEMP/e2e.log" >> e2e-report.txt
          exit 0
      - name: publish the report branch
        run: |
          git config user.email "ci@w2m.local"
          git config user.name "w2m-ci"
          git checkout -B ci-e2e-report
          git add -f e2e-report.txt
          git commit -m "e2e report"
          git push --force origin ci-e2e-report
