# This file is the bundle patch declared by package.json's `dsh.bundle.patch`.
# It mounts the plugin by its package name, whose root export is the plugin
# (`lib/index.js` re-exports `./tools.js`), so reading this file tells you which
# package becomes the plugin.
#
# ---------------------------------------------------------------------------
# Why the row names the package and not the `/tools` subpath (v0.5.4)
# ---------------------------------------------------------------------------
# Until v0.5.4 this row said `name: '@twinsearth/w2m-dsh-plugin/tools'`, and for a
# host-only plugin that was fine. It stops being fine the moment the package also
# ships a browser half, because the client module system identifies a package by
# the *package specifier* its Loader row carries:
#
#   client-modules: resolveMeta(loaderName, baseUrl)   (dsh-client-modules)
#     exactPackageSpecifier('@twinsearth/w2m-dsh-plugin/tools') -> undefined
#     ... -> locatePkgJson returns undefined -> the entry is not a client package
#
# A subpath specifier resolves to no package manifest at all, so a `/tools` row is
# invisible to the scan: `lib/client.js` is never composed into `__DSH_BOOT__`, and
# the composer control can never register -- whatever else is fixed. Measured on the
# 0.5.4 tarball through the real Loader: the composed boot graph held rows for
# `@deepseek-ai/dsh-typert-registry` and `@deepseek-ai/dsh-api-gateway` and none for
# this package. Naming the bare package fixes it, because the root export already
# re-exports exactly what `/tools` exports (`test/tools.test.mjs` asserts the two
# carry the same `inject`), so the host half is unchanged. `./tools` remains a
# supported mount point for anyone who wants it -- it is simply not the one this
# bundle uses.
#
# ---------------------------------------------------------------------------
# Why this is an `insert:` list and not a bare `- id: w2m`
# ---------------------------------------------------------------------------
# A bare `- id: w2m` entry is a *non-insert* patch: it replaces fields on an
# entry that an earlier layer already created. No earlier layer creates `w2m`,
# so the Loader reports
#
#   dsh: [@twinsearth/w2m-dsh-plugin] patch: entry "w2m" not found
#
# and skips it. Measured with DSH 0.2.0-rc.2 (`--dump-config-schema`, $defs.patch):
#
#   "An insert appends entries, optionally inside the group identified by id.
#    Other patches replace supplied fields; ... Unknown targets and non-insert
#    patches without a nonempty id are warned and skipped."
#
# The consequence of the old shape was silent: `dsh plugin add` succeeded, the
# profile listed the bundle, DSH started cleanly -- and **no `w2m` row was ever
# composed**, so none of the eight tools existed. `--dump-config` showed 183 rows
# and zero of them named this package.
#
# ---------------------------------------------------------------------------
# Configuring the relay URL, and the direct path (v0.4.0)
# ---------------------------------------------------------------------------
# The relay URL has a default as of v0.4.0: the shared W2M server, which hosts the
# relay, a STUN server and a reverse proxy on one address. Leaving `rabbitUrl` empty
# therefore means "use the shared server", not "guess" -- and `w2m_status` reports
# `rabbit_source: "shared-default"` with a note naming the address, so a machine
# talking to somebody else's host can never be a surprise.
#
# The order is `rabbitUrl` -> `W2M_RABBIT_URL` -> the shared server, and an explicit
# value always wins. Set one of the first two to run against your own relay:
#
#   - id: w2m
#     config:
#       rabbitUrl: https://w2m.example.com        # may include a sub-path
#       operatorToken: !!js process.env.W2M_OPERATOR_TOKEN
#       stateDir: !!js (process.env.DSH_HOME + '/xclient')
#
# `operatorToken` is the credential that authorises *sending* instructions. It is
# separate from the per-machine device token on purpose: a machine that can receive
# work should not automatically be able to command the others. The relay writes it to
# <state>/operator-token.txt on first start and prints it once.
#
# `p2pMode` decides how a dispatched offer travels, and it is the release's headline
# switch, so every value is validated at load and a typo is refused rather than
# defaulted:
#
#   auto    (default) punch the direct path and push the offer over it; the relay's
#           own offer on the SSE stream stays as the fallback, so a failed punch is
#           invisible to the caller except in `direct_pushes` and each machine's
#           `transport`. This is what `W2M_P2P_MODE` unset gives you.
#   direct  the same push, but a failed punch is not hidden: the executor refuses an
#           offer that did not arrive over the direct path
#           (`refusal_reason: P2P_UNAVAILABLE`), so a fleet that must use the fast
#           path fails loudly instead of quietly falling back.
#   relay   no UDP socket is bound at all and nothing is dialled -- exactly v0.3.9's
#           behaviour. Use it to take the direct path out of the picture entirely
#           while diagnosing something else.
#
#   - id: w2m
#     config:
#       p2pMode: relay                            # or W2M_P2P_MODE=relay
#
# `stunServers` is the list used to discover the address a peer can reach this machine
# on. Unset means the shared server first, then three public fallbacks -- the shared
# server is asked first on purpose, because a machine that can reach the relay can
# reach that STUN server, so the address it reports is measured over the same path the
# punch will use. Naming servers replaces that list, so give the shared one explicitly
# if you still want the relay's own path measured:
#
#   - id: w2m
#     config:
#       stunServers: ['202.182.123.154:3478', 'stun.example.com:3478']
#                                                # or W2M_STUN_SERVERS=a:3478,b:3478
#
# A loopback punch (both machines on one host) exercises the code path and says nothing
# about NAT traversal; `w2m_status` reports the measured NAT mapping so the difference
# is visible rather than assumed.
- insert:
    - id: w2m
      name: '@twinsearth/w2m-dsh-plugin'
      config:
        rabbitUrl: ''
        operatorToken: ''
        autoStartAgent: true
        machineName: ''
        allowedCommands: []
        p2pMode: auto
        stunServers: []
    # DSH-GPW (Global Permission Watchdog) ships with this package and is **off until an operator turns it on**.
    #
    # It is in this insert list rather than left out of the tree entirely, because a plugin the composed tree does
    # not mention is a plugin the plugin manager cannot list -- and then "enable it manually" has no control to
    # click. **A row with `disabled: true` is the shape that makes it installable with the package and switchable
    # from the UI**: the component shows up, its toggle is off, and flipping it needs no file edit.
    #
    # Found this way, not assumed: v1.0.5 shipped the subpath export but no row, so the watchdog was reachable only
    # by hand-editing a profile patch. **An optional component nobody can find is not optional, it is absent.**
    #
    # What it does once enabled: answers `approval/request` with at most 10 auto-approvals per rolling 60 s, at
    # least 3000 ms apart, and defers everything past that to the human prompt, where it waits.
    - id: dsh-desktop
      name: '@twinsearth/w2m-dsh-plugin/desktop'
      disabled: true
      config: {}
    - id: dsh-gpw
      name: '@twinsearth/w2m-dsh-plugin/gpw'
      disabled: true
      config:
        maxPerWindow: 10
        windowMs: 60000
        minGapMs: 3000
        # v1.7.5+: only act in the 完全权限 preset; the two folder lists are the gate's policy.
        # Folders are added at runtime from the GPW panel into $DSH_HOME/xclient/gpw-folders.json.
        requireFullAccess: true
        whitelist: []
        blacklist: []
        pendingTimeoutMs: 120000
    # 决策中心 (decision center): the human-attention queue, ported from dsh-Fang's
    # `@twinsearth/dsh-fang/decision-center` in v3.0.0.
    #
    # Unlike GPW this row is **enabled**: the center is the panel the GPW settings page and the GPW
    # floating launcher render (read through /api/w2m/decisions), and a disabled row would leave that
    # panel with no store behind it. The store lives under $DSH_HOME/xclient/decision-center; the row
    # carries no config so the plugin's own defaults apply.
    # 队列日志 (queue journal): composer drafts and the queue mirror, ported from dsh-Fang's
    # @twinsearth/dsh-fang-queue-journal in v3.1.0. Enabled so the composer dock appears.
    # 互联契约 (contract 1.x): w2m.* methods over the published @twinsearth/dsh-fang-contract SDK.
    # Independent from dsh-fang and dsh-master: no shared code, only method table + envelope + transport.
    - id: dsh-w2m-contract
      name: '@twinsearth/w2m-dsh-plugin/contract'
      config: {}
    - id: dsh-queue-journal
      name: '@twinsearth/w2m-dsh-plugin/queue-journal'
      config: {}
    - id: dsh-decision-center
      name: '@twinsearth/w2m-dsh-plugin/decision-center'
      config: {}
    # 自修复 (dsh-fix): repairs sessions whose history references a deleted image attachment object.
    #
    # Enabled: this is the release's headline behaviour and the failure it addresses is permanent
    # (the bytes are gone, so retrying cannot help). It listens on the agent loop's
    # `agent/request-error` waterfall, appends the official `image/offload` event for unreadable
    # images on the current surface, flushes, and retries the step. A real network failure is
    # delegated untouched; at most 3 repairs per session per turn.
    #
    # The mount marker is $DSH_HOME/xclient/dsh-fix-state.json; the offline CLI is `w2m-fix`
    # (also `node cli/bin/dsh-fix-attachments.mjs`), documented in docs/DSH-FIX.md.
    - id: dsh-fix
      name: '@twinsearth/w2m-dsh-plugin/dsh-fix'
      config:
        maxRepairsPerTurn: 3

    # 备份&还原 (dsh-backup): the scheduled, content-addressed repository engine -- the 22:00 timer (default
    # Asia/Shanghai) and the `POST /api/w2m/backup/run` route the panel calls. The engine keeps sealed/plaintext
    # repository state, rotation and the panel routes; docs/BACKUP-DESIGN.md is its protocol.
    #
    # It ships `disabled: true`: this is the first W2M row whose timer WRITES to disk unattended, so it must be
    # discoverable in the plugin manager and turned on by an explicit operator action -- not arrive with the package.
    # Enabling the row is the decision; `ctx.effect` guarantees its timer dies with the row.
    # Offline CLI: `w2m-backup` (`run` / `status` / `scan` / `list` / `gc` / `selftest`).
    # Archive tool surface (a separate, stateless row): docs/BACKUP-SUBPLUGIN.md.
    - id: dsh-backup
      name: '@twinsearth/w2m-dsh-plugin/dsh-backup'
      disabled: true
      config:
        backupDir: 'D:\DeepSeekHarness\BackUP'
        backupTimes: ['22:00:00']
        backupTimeZone: Asia/Shanghai
        backupScope: all
        keepOldPerSession: 10
        # 整文件副本上限（MB）：oldFormat=full 时单个会话文件超过 300 MB 需显式「特批」才会写入；0 = 不设上限。
        backupFullCopyMaxMb: 300
        # old/ 总量不设上限（用户决定）：每增加 10 GB 只提醒一次，由用户决定是否手动清理（w2m-backup gc）；0 = 关闭提醒。
        backupOldUsageReminderGb: 10
        # v3.5.1 内存与启动安全：漏槽补跑默认不在挂载路径自动执行（只记 pending_catch_up 并排下一槽）；
        # 显式人工 run（面板/CLI）或下一槽才跑。设 true 恢复旧行为（仍在 12 小时窗口内，且延迟到挂载栈外）。
        backupCatchUpOnStart: false
        # v3.5.1 内存护栏上限（MB）：引擎在物化大文件前检查 heapUsed，超出则以 BACKUP_MEMORY_GUARD 命名拒绝而非 OOM；0 = 关闭。
        backupMaxHeapMb: 1536
        # 每次成功的定时备份后异步跑一次 G5 运行时终审并写缓存（面板默认显示最新记录；off 可关闭）。
        backupRuntimeVerify: nightly
        # P0/P3: registry/config/state and the w2m restore copies are on by default - a backup without them cannot
        # rebuild a usable home or undo a bad restore. Restore copies carry their own larger, non-refusing caps.
        backupScopes: ['sessions', 'attachments', 'registry', 'config', 'state', 'restore_copies']
        # P1: credentials are OFF by default; turn on only when the repository itself is trusted.
        backupIncludeSecrets: false
        # 字面兼容需求 3：被替换的旧版本除记录外再写一份整文件加密副本（old/<ws>/<sid>/…json.enc）。
        # 代价：每个被替换版本在去重块之外多占一份整文件字节；不想要时改成 records。
        backupOldFormat: full
        # §25.0 用户最终决定：默认不加密（none = DEK 明文在 keys.json；任何人读到仓库目录即可还原）。
        # 想要账户/机器/PIN 保护时改成 sealed（会在新建仓库时写 account/machine/password 信封）。
        backupEncryption: none
        # §25 账户 ID 绑定解锁（用户决定）：只读取账户唯一识别码做比对，一致免密放行；不是机密性路径。
        # 只对 sealed 仓库生效；none 仓库永不绑定（它本来就不需要凭据）。
        backupAccountBinding: true

    # 备份&还原 · 独立挂载 (dsh-backup-plugin): the **stateless archive tool surface** as its own row -- the six
    # `backup_*` tools (`status` / `list` / `create` / `verify` / `restore` / `import_session_zip`) whose backups are
    # self-contained ZIP files rather than a repository.
    #
    # It mounts NO timer, NO panel route and NO repository: every call reads or writes exactly one archive. That is
    # why it **coexists** with the `dsh-backup` row above instead of replacing it -- one scheduler/repository plus one
    # on-demand archive surface, with no second timer and no duplicate route to conflict with. The older
    # `BACKUP_ALREADY_MOUNTED` rule was about two *repository* mounts; this row has no repository to double-mount.
    #
    # It ships `disabled: true`: a tool surface that writes archives, and can restore one over a project, must not
    # arrive because someone installed the fleet plugin. Enabling it is the operator's decision.
    # Docs: docs/BACKUP-SUBPLUGIN.md. Protocol: docs/BACKUP-DESIGN.md.
    - id: dsh-backup-plugin
      name: '@twinsearth/w2m-dsh-plugin/dsh-backup-plugin'
      disabled: true
      config:
        # Empty = resolve the default, <DSH_HOME>/backups/w2m-dsh-backup-plugin. Set a path to collect archives elsewhere.
        backupRoot: ''
        includeProject: true
        includeSessions: true
        includeProfile: false
        # 0 = keep every archive; the archive engine prunes only when this is a positive integer.
        keepBackups: 0
        # Per-entry size cap (64 MiB): a larger project file is reported as skipped, never truncated.
        maxFileBytes: 67108864

    # P2P 优先传输层 · WebRTC (dsh-p2p-webrtc): an opt-in second transport stack. It is **not** a
    # replacement for the UDP punch or the relay: `deliver.mjs` still owns dispatch, and the row
    # ships disabled. Enabling it requires an external WebRTC engine process (`providerCommand`)
    # because the package deliberately has zero runtime dependencies; the transport owns signaling,
    # ICE policy and Noise_IK_25519_ChaChaPoly_SHA256, and the engine owns only the DataChannel.
    #
    # The client needs the peer's pinned static key (`peerPublicKey`); the host needs `peerKeys`.
    # SDP/ICE are exchanged through a standalone WebSocket signaling server (`w2m-webrtc-signal`),
    # never learned as trust material. Docs: docs/P2P-WEBRTC.md.
    - id: dsh-p2p-webrtc
      name: '@twinsearth/w2m-dsh-plugin/dsh-p2p-webrtc'
      disabled: true
      config:
        # 'pool' = publish the shared WebRTC pool for desktop / Teams / P2P V2 (production default);
        # 'single' = one transport, kept for compatibility and one-pair diagnostics.
        mode: 'pool'
        # Both sides connect outbound; the server only forwards SDP/ICE and never sees data bytes.
        signalUrl: ''
        signalToken: ''
        # Empty = this machine's device.json rabbit_url, then W2M_RABBIT_URL. Used only to resolve
        # peer static keys for the pool; task dispatch itself stays on the pool.
        rabbitUrl: ''
        room: 'w2m'
        # host or client. Empty means "must be supplied at start"; there is no guessed default.
        role: ''
        peerMachineId: ''
        machineId: ''
        peerPublicKey: ''
        peerKeys: {}
        # Empty = <DSH_HOME>/xclient/device.key, beside the agent's device.json. Creation is opt-in.
        deviceKeyDir: ''
        allowCreateDeviceKey: false
        # An executable that speaks the JSON-line provider protocol in docs/P2P-WEBRTC.md.
        providerCommand: ''
        providerArgs: []
        providerCwd: ''
        providerEnv: {}
        iceServers: []
        preferP2p: true
        allowRelay: true
        maxRttMs: 350
        connectTimeoutMs: 30000
        handshakeTimeoutMs: 15000
        peerTimeoutMs: 20000
        statsPollMs: 2000
        # autoStart is still opt-in even when the row is enabled; mount-time has no process side effects.
        autoStart: false

    # Production profile example (copy into the fleet profile patch, not into the package default):
    # - id: dsh-p2p-webrtc
    #   disabled: false
    #   config:
    #     mode: 'pool'
    #     autoStart: true
    #     signalUrl: 'wss://signal.example/w2m/webrtc'
    #     providerCommand: 'node'
    #     providerArgs: ['/opt/w2m/webrtc-provider.mjs']
    # - id: dsh-desktop
    #   disabled: false
    #   config: { transport: 'webrtc', allowLegacyP2P: false }

    # P2P V2 文件面 (dsh-p2p-v2): WebTorrent 负责多对多分片，V1 WebRTC 是它的 peer 传输层。
    #
    # 任务分发仍走上面的 `dsh-p2p-webrtc` 共享 pool；V2 不建立第二个调度器，也不把文件字节塞进
    # relay。`share`/`add` 惰性加载 WebTorrent；`attach` 才打开 V1 pair；`stop`/`detach` 只销毁
    # 逻辑 torrent 流，绝不 `closePeer`。WebTorrent 是可选引擎：包本身仍是零运行时依赖，生产需要
    # 单独安装并把 `webTorrentModule` 指向入口文件，缺失时按名称拒绝。
    #
    # 默认关闭 tracker/DHT/LSD/uTP/UPnP/NAT-PMP，只连显式传入的编队 machine id。开启
    # `allowNativeTrackers` 才会把 `trackers` 发布给公共 tracker；这是不同的隐私合同。
    # Docs: docs/design/P2P-V2-WEBTORRENT.md.
    - id: dsh-p2p-v2
      name: '@twinsearth/w2m-dsh-plugin/dsh-p2p-v2'
      disabled: true
      config:
        # 'webtorrent' uses the host's resolution; absolute/file path points at an external install.
        webTorrentModule: 'webtorrent'
        # Empty state dir means <DSH_HOME>/p2p-v2. Reserved for metadata/cache; no bytes are stored here.
        stateDir: ''
        trackers: []
        allowNativeTrackers: false
        maxShares: 8
        maxPeersPerShare: 16
        maxConns: 32
        readyTimeoutMs: 30000
        metadataTimeoutMs: 10000
        writeTimeoutMs: 15000


    # Teams 子插件 (dsh-teams): opt-in 编队联合开发与多机实时协同的产品面与 WebRTC 数据面。它不是新的派发入口：
    # 审批与派发仍在 `w2m-joint`（操作员 CLI）和设置页，模型只能看到房间和状态，不能签审批、不能发命令。
    #
    # 网络分层由插件强制，不由调用方选择：
    #   控制面 / 心跳 / 用户信息 / 计划 / 审批 / 租约 -> Relay TCP（每消息仅 1 次）
    #   图片 / 文件 / artifact / 数据同步            -> WebRTC DataChannel（同一个 pool，固定最多 33 次，失败即放弃并告警，不回落 Relay）
    # The `dsh-p2p-webrtc` row above builds the shared WebRTC pool; this row consumes it for Teams data:
    # orchestration views plus `w2m_team_artifact` (bytes only, never dispatch).
    # Docs: docs/TEAMS.md.
    - id: dsh-teams
      name: '@twinsearth/w2m-dsh-plugin/dsh-teams'
      disabled: true
      config:
        # Empty rabbitUrl = use W2M_RABBIT_URL, then this machine's device.json. No shared-server guess.
        rabbitUrl: ''
        # Empty stateDir = resolve from DSH_HOME; plans are read-only summaries, never dispatched here.
        stateDir: ''
        # Empty deviceFile = <DSH_HOME>/xclient/device.json, the same identity every other tool uses.
        deviceFile: ''
        projectId: 'default'
        staleAfterMs: 90000
        # Fixed ceiling in code; shown here for operators. Raising this value does not raise the policy.
        dataMaxAttempts: 33
        dataRetryDelayMs: 1000
        # Reserved: mount never opens a socket, so enabling a row is still an explicit operator act.
        autoStart: false
